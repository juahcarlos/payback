[project]
name = "whox-backend"
version = "0.1.0"
description = "WhoX site backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.17.2",
    "bcrypt==4.3.0",
    "betterproto==2.0.0b4",
    "cryptography>=46.0.3",
    "fastapi>=0.124.0",
    "fastapi-mail>=1.6.0",
    "fastapi-sessions>=0.3.2",
    "geoip2>=5.2.0",
    "httpx>=0.28.1",
    "ipwhois>=1.3.0",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "pytz>=2025.2",
    "redis>=7.1.0",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "anyio>=4.12.0",
    "asgi-lifespan>=2.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.8",
    "types-passlib>=1.7.7.20250602",
    "types-python-jose>=3.5.0.20250531",
]

[tool.pytest.ini_options]
addopts = "-p no:logging"
anyio_mode = "auto"
pythonpath = ["."]

[tool.pytest_env]
# "D:DATABASE_URL" = "mysql+aiomysql://test:test@127.0.0.1/test"
COOKIE_PASSWORD = "pass"
BUY_FILLING_SECRET = "secret"
HIDDEN_CAPTCHA_SECRET = "secret"
EMAIL_UNSUBSCRIBE_SECRET = "secret"
SERVER_SECRET_KEY = "secret"
SIGNATURE_SECRET = "secret"
CRYPTOMUS_SECRET_KEY = "secret"
MAIL_PASSWORD = "pass"

[tool.ruff]
exclude = [
    ".venv",
    "tests",
]
line-length = 120
lint.select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]
lint.ignore = ["ERA001"]  # For now only

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", ".venv/"]
plugins = ["pydantic.mypy"]
